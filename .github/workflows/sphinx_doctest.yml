name: Test with doctest blocks with Sphinx

on:
  push:
    paths:
      - .github/workflows/sphinx_doctest.yml
      - doc/**
      - versionah/*.py

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          activate-environment: true
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install package and dependencies
        run: |
          uv pip install -r extra/requirements-doc.txt

      - name: Run tests
        run: |
          sphinx-build --builder doctest --doctree-dir build/doctrees doc build/doctest
